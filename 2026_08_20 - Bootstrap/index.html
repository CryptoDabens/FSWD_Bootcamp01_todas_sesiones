<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap - Bienvenida</title>
    <link rel="stylesheet" href="main.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div class="container text-center">
      <div class="row">
        <div class="col columna">
            <select class="form-select" arial-label="Default select example">
              <option selected>Selecciona un pais</option>
              <option value="1">Mexico</option>
              <option value="2">USA</option>
              <option value="3">Canada</option>
            </select>
        </div>
        <div class="col">Column</div>
        <div class="col">Column</div>
      </div>

      <div class="row carrusel-principal">
        <div class="container overflow hidden"> <!-- se agregó overflow-hidden para ocultar el contenido que excede el contenedor -->
          <div id="carouselExample" class="carousel slide">
            <div class="carousel-inner overflow-hidden"> <!-- se agregó overflow-hidden para ocultar el contenido que excede el contenedor -->
              <div class="carousel-item active">
                <img 
                    src="https://s-media-cache-ak0.pinimg.com/originals/fb/6d/16/fb6d16c4321ab45dad1c6290f2740f7a.jpg" 
                    class="d-block w-100" 
                    alt="..." 
                />
              </div>
              <div class="carousel-item">
                <img src="https://cdn.pixabay.com/photo/2015/03/25/01/47/puppies-688425_1280.jpg" 
                class="d-block w-100" 
                alt="..." />
              </div>
              <div class="carousel-item">
                <img src="https://conambiental.com/wp-content/uploads/2025/05/perritos-tiernos-jugando-en-el-parque.jpeg" 
                class="d-block w-100" 
                alt="..." />
              </div>
            </div>
            <button
              class="carousel-control-prev"
              type="button"
              data-bs-target="#carouselExample"
              data-bs-slide="prev"
            >
              <span
                class="carousel-control-prev-icon"
                aria-hidden="true"
              ></span>
              <span class="visually-hidden">Previous</span>
            </button>
            <button
              class="carousel-control-next"
              type="button"
              data-bs-target="#carouselExample"
              data-bs-slide="next"
            >
              <span
                class="carousel-control-next-icon"
                aria-hidden="true"
              ></span>
              <span class="visually-hidden">Next</span>
            </button>
          </div>
         </div>
        </div>
        <!-- md = medium devices, 12 = full width (number of columns, for bootstrap is 12) -->
      
      <div class="row">
        <div class="col-md-6 col-b">B</div>
        <div class="col-md-5 col-c">C</div>
        <div class="col-md-3 col-d">D</div>
      </div>

      <hr />
      <!-- Responsividad-->
      <div class="row">
        <div class="col-sm-8 col-e">E</div>
      </div>

      <div class="row">
        <div class="col-md-8 col-e">
          <table class="table">
            <thead>
              <tr class="table-success">
                <th scope="col">#</th>
                <th scope="col">First</th>
                <th scope="col">Last</th>
                <th scope="col">Handle</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <th scope="row">1</th>
                <td>Mark</td>
                <td>Otto</td>
                <td>@mdo</td>
              </tr>
              <tr>
                <th scope="row">2</th>
                <td>Jacob</td>
                <td>Thornton</td>
                <td>@fat</td>
              </tr>
              <tr>
                <th scope="row">3</th>
                <td>John</td>
                <td>Doe</td>
                <td>@social</td>
              </tr>
            </tbody>
          </table>
        </div>
        <!-- Ejemplo para md vs sm-->
      </div>

      <hr />

      <div class="row">
        <div class="col-lg-8 col-e">E</div>
        <!-- Ejemplo para lg vs md -->
      </div>

      <div class="row">
        <div class="col-xl-8 col-e">E</div>
        <!-- Ejemplo para xl vs lg -->
      </div>
    </div>
  </body>
</html>
